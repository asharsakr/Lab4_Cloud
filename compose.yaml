services:
  frontend:
    image: nginx:alpine
    container_name: registration-frontend
    ports:
      - "8099:80" # Replace XX with the last two digits of your Student ID
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - backend-network
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: registration-backend
    environment:
      - DB_HOST=db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend-network
      - database-network
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    container_name: registration-database
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - database-network
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: registration-adminer
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - database-network
    depends_on:
      - db
    restart: unless-stopped
  redis:
    image: redis:alpine
    container_name: registration-redis
    networks:
      - backend-network
    restart: unless-stopped

networks:
  backend-network:
  database-network:

volumes:
  pg-data:
